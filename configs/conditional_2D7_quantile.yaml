# 2D.7 — head.kind=quantile (pinball loss at 0.05, 0.5, 0.95).
# Identical seed/data/hparams to configs/conditional.yaml; head.kind=quantile.

seed: 42

data:
  benchmark_file: data_processed/spy/benchmarks/spy_phase1_random40_noiselow.parquet
  batch_size: 32
  num_workers: 0

conditional:
  context_dim: 3
  coord_dim: 2
  hidden_dim: 128
  latent_dim: 64
  n_elem_layers: 2
  n_post_layers: 1
  n_decoder_layers: 3

  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 10

  head:
    kind: quantile
    quantiles: [0.05, 0.5, 0.95]

paths:
  checkpoint_dir: artifacts/runs/2D7/quantile/checkpoints
  log_dir: artifacts/runs/2D7/quantile/logs
  results_dir: artifacts/runs/2D7/quantile
