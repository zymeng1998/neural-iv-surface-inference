# 4A.4 — RBF-prior residual hybrid on OTM, head.kind=quantile.
# Clone of 3X.9 quantile; only deltas: residual benchmark + target_mode:
# residual (ADR 0010). Model fits the residual; driver reconstructs
# σ̂ = rbf_pred + f_θ (and shifts the quantile bands by rbf_pred).

seed: 42

data:
  benchmark_file: data_processed/spy/benchmarks/spy_phase1_random40_noiselow_otm_residual.parquet
  target_mode: residual
  batch_size: 32
  num_workers: 0

conditional:
  context_dim: 3
  coord_dim: 2
  hidden_dim: 128
  latent_dim: 64
  n_elem_layers: 2
  n_post_layers: 1
  n_decoder_layers: 3

  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 10

  decoder_kind: anp
  anp:
    n_heads: 4
    d_head: null
    mlp_hidden: 128
    include_z_in_decoder: true
  coord_encoding:
    kind: raw
  freeze_encoder: false

  head:
    kind: quantile
    quantiles: [0.05, 0.5, 0.95]

paths:
  checkpoint_dir: artifacts/runs/4A4/quantile/checkpoints
  log_dir: artifacts/runs/4A4/quantile/logs
  results_dir: artifacts/runs/4A4/quantile
