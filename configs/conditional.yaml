# Conditional surface model configuration (Phase 2 — W3, 2C.4)
#
# Mirrors configs/baseline.yaml structure; do not modify baseline.yaml.

seed: 42

# ── Data ────────────────────────────────────────────────────────────
data:
  benchmark_file: data_processed/spy/benchmarks/spy_phase1_random40_noiselow.parquet
  batch_size: 32          # batches are *dates*, not points
  num_workers: 0

# ── Conditional surface model (2C.3 modules) ───────────────────────
conditional:
  context_dim: 3          # (log_moneyness, tau, implied_volatility)
  coord_dim: 2            # (log_moneyness, tau) at query
  hidden_dim: 128
  latent_dim: 64
  n_elem_layers: 2
  n_post_layers: 1
  n_decoder_layers: 3

  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 10

  # ── Decoder architecture (Phase 3B / W11 — 3B.2) ──────────────────
  # decoder_kind: deepsets — Phase 2 baseline: mean-pool DeepSets latent
  #                          z_t fed to a coordinate MLP. Bit-for-bit
  #                          equivalent to the 2C / 2D.2 path.
  # decoder_kind: anp      — ANP cross-attention decoder (3B.2). Encoder
  #                          exposes pre-pool per-element embeddings H;
  #                          decoder cross-attends each query into H,
  #                          forms a query-specific context vector c_q,
  #                          and routes [z, c_q, q] through the same
  #                          gaussian / quantile / point head dispatch.
  decoder_kind: deepsets
  anp:
    n_heads: 4
    d_head: null            # null → d_h // n_heads
    mlp_hidden: 128
    include_z_in_decoder: true

  # ── Predictive head (Phase 2D / W4 — 2D.2) ────────────────────────
  # kind: point     — 2C baseline (masked MSE on μ). Default; preserves
  #                   byte-for-byte behavior with the original 2C recipe.
  # kind: gaussian  — heteroscedastic Gaussian head (μ, σ); trained with
  #                   masked Gaussian NLL. Emits raw σ; calibration is 2D.4.
  # kind: quantile  — quantile head with the levels listed in `quantiles`;
  #                   trained with masked pinball loss.
  head:
    kind: point
    quantiles: [0.05, 0.5, 0.95]

# ── Deep ensemble (Phase 2D / W4 — 2D.3) ───────────────────────────
# Used by scripts/run_ensemble_train.py and the EnsembleConditionalPredictor
# adapter. `size` members are trained, each with the corresponding entry from
# `seeds`. The full K-seed AV training pass lives in story 2D.8 — locally
# only the 2-member synthetic smoke is exercised.
ensemble:
  size: 5
  seeds: [101, 202, 303, 404, 505]

# ── Output paths ───────────────────────────────────────────────────
paths:
  checkpoint_dir: artifacts/checkpoints
  log_dir: artifacts/logs
  results_dir: artifacts/results
