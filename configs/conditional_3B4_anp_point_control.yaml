# 3B.4 — ANP cross-attention decoder, head.kind=point (regression control vs 3A.3 raw).
# Clones configs/conditional_2D7_point_control.yaml; swaps decoder_kind to anp,
# pins coord_encoding.kind=raw per 3A measured result, end-to-end retrain.
# Identical seed / optimizer / schedule / epochs to 2D.7.

seed: 42

data:
  benchmark_file: data_processed/spy/benchmarks/spy_phase1_random40_noiselow.parquet
  batch_size: 32
  num_workers: 0

conditional:
  context_dim: 3
  coord_dim: 2
  hidden_dim: 128
  latent_dim: 64
  n_elem_layers: 2
  n_post_layers: 1
  n_decoder_layers: 3

  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 10

  decoder_kind: anp
  anp:
    n_heads: 4
    d_head: null
    mlp_hidden: 128
    include_z_in_decoder: true
  coord_encoding:
    kind: raw
  freeze_encoder: false

  head:
    kind: point
    quantiles: [0.05, 0.5, 0.95]

paths:
  checkpoint_dir: artifacts/runs/3B4/point_control/checkpoints
  log_dir: artifacts/runs/3B4/point_control/logs
  results_dir: artifacts/runs/3B4/point_control
