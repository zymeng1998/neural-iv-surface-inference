# 3X.8 — DeepSets/mean-pool conditional, head.kind=gaussian, on OTM.
# Faithful clone of configs/conditional_2D7_gaussian.yaml; only the dataset
# is repointed to random40_noiselow_otm and outputs land under 3X8/.
# decoder_kind is left at the model default (deepsets / mean-pool) exactly
# as the original 2D.7 run. From-scratch (D8). Faithful restatement — do
# NOT change architecture or hparams.

seed: 42

data:
  benchmark_file: data_processed/spy/benchmarks/spy_phase1_random40_noiselow_otm.parquet
  batch_size: 32
  num_workers: 0

conditional:
  context_dim: 3
  coord_dim: 2
  hidden_dim: 128
  latent_dim: 64
  n_elem_layers: 2
  n_post_layers: 1
  n_decoder_layers: 3

  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 10

  head:
    kind: gaussian
    quantiles: [0.05, 0.5, 0.95]

paths:
  checkpoint_dir: artifacts/runs/3X8/single_gaussian/checkpoints
  log_dir: artifacts/runs/3X8/single_gaussian/logs
  results_dir: artifacts/runs/3X8/single_gaussian
